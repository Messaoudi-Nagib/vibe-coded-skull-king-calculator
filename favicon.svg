<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond noir pirate -->
  <rect width="32" height="32" rx="5" fill="#0d1117"/>

  <!-- Tibias croisés (derrière le crâne) -->
  <line x1="6" y1="27" x2="26" y2="7"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="26" y1="27" x2="6"  y2="7"  stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="6"  cy="27" r="3" fill="white"/>
  <circle cx="26" cy="27" r="3" fill="white"/>
  <circle cx="6"  cy="7"  r="3" fill="white"/>
  <circle cx="26" cy="7"  r="3" fill="white"/>

  <!-- Crâne -->
  <ellipse cx="16" cy="15" rx="8" ry="7.5" fill="white"/>
  <!-- Mâchoire -->
  <rect x="11.5" y="19.5" width="9" height="4.5" rx="1.5" fill="white"/>
  <!-- Orbites -->
  <ellipse cx="13" cy="14.5" rx="2.4" ry="2.8" fill="#0d1117"/>
  <ellipse cx="19" cy="14.5" rx="2.4" ry="2.8" fill="#0d1117"/>
  <!-- Cavité nasale -->
  <path d="M15 18 L16 19.5 L17 18 Z" fill="#0d1117"/>
  <!-- Dents -->
  <rect x="12.2" y="21.5" width="2"   height="2.8" rx="0.6" fill="#0d1117"/>
  <rect x="15"   y="21.5" width="2"   height="2.8" rx="0.6" fill="#0d1117"/>
  <rect x="17.8" y="21.5" width="2"   height="2.8" rx="0.6" fill="#0d1117"/>
</svg>
